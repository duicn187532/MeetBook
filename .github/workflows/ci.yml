name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: main/project
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno fmt --check
      - run: deno lint
      - run: deno task check
      - run: deno task test

  backend-integration:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: main/project
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      # 交易需要 replica set，因此以單節點 replica set 啟動 MongoDB
      - name: Start MongoDB replica set
        run: |
          docker run -d --name mongo -p 27017:27017 mongo:7 --replSet rs0 --bind_ip_all
          for i in $(seq 1 30); do docker exec mongo mongosh --quiet --eval "db.adminCommand('ping')" && break; sleep 1; done
          docker exec mongo mongosh --quiet --eval "rs.initiate({_id: 'rs0', members: [{_id: 0, host: 'localhost:27017'}]})"
          for i in $(seq 1 30); do docker exec mongo mongosh --quiet --eval "db.hello().isWritablePrimary" | grep -q true && break; sleep 1; done
      - run: deno task test:integration
        env:
          MONGODB_TEST_URI: mongodb://localhost:27017/?replicaSet=rs0

  # Cloudflare Workers 後端（遷移中）：目前是 D1 資料表與轉檔工具
  worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: main/worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: main/worker/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      # 轉檔流程測試會啟動 MongoDB（mongodb-memory-server），快取下載的執行檔
      - uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binaries-7.0.14-${{ runner.os }}
      - run: npm test
        env:
          MONGOMS_DOWNLOAD_DIR: /home/runner/.cache/mongodb-binaries

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: main/meetingbooking
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: main/meetingbooking/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
        env:
          VITE_API_URL: https://example.invalid/api/bookings/
