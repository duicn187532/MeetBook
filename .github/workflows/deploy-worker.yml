# 部署 Cloudflare Worker（後端）：main 上的 Worker 相關檔案有變動時自動部署，也可以手動執行
# Worker 部署到 *.workers.dev（LINE webhook 使用）；另外部署 Cloudflare Pages 入口 *.pages.dev，
# 把請求轉給同一個 Worker（公司網路擋 workers.dev，但可以連 pages.dev），見 main/pages-entry
name: 部署 Worker

on:
  push:
    branches: [main]
    paths:
      - "main/worker/**"
      - "main/project/admin/index.html"
      - "main/pages-entry/**"
      - ".github/workflows/deploy-worker.yml"
  workflow_dispatch:

permissions:
  contents: read

# 同時只跑一個部署，新的會排在舊的後面
concurrency:
  group: deploy-worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      WRANGLER_SEND_METRICS: "false"
    defaults:
      run:
        working-directory: main/worker
    steps:
      - name: 檢查設定
        id: check
        working-directory: .
        env:
          HAS_CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
          HAS_CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
        run: |
          if [ "$HAS_CF_TOKEN" = "true" ] && [ "$HAS_CF_ACCOUNT" = "true" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::尚未設定 CLOUDFLARE_API_TOKEN／CLOUDFLARE_ACCOUNT_ID，略過部署"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.check.outputs.ready == 'true'

      - uses: actions/setup-node@v4
        if: steps.check.outputs.ready == 'true'
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: main/worker/package-lock.json

      - name: 安裝與型別檢查
        if: steps.check.outputs.ready == 'true'
        run: |
          npm ci
          npm run typecheck

      - name: 準備 D1（不存在就建立）並套用 migrations
        if: steps.check.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node atlas-import/d1_setup.ts
          npx wrangler d1 migrations apply meetbook --remote

      - name: 部署（同時寫入 Worker secrets）
        if: steps.check.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          LINE_CHANNEL_SECRET: ${{ secrets.LINE_CHANNEL_SECRET }}
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
        run: |
          # 只寫入有設定的 secrets（沒設定的保留 Worker 上原本的值）；檔案只存在這次執行的暫存資料夾，用完即刪
          secrets_file="$RUNNER_TEMP/worker-secrets.json"
          trap 'rm -f "$secrets_file"' EXIT
          node -e '
            const out = {};
            for (const k of ["ADMIN_PASSWORD", "LINE_CHANNEL_SECRET", "LINE_CHANNEL_ACCESS_TOKEN"]) if (process.env[k]) out[k] = process.env[k];
            require("fs").writeFileSync(process.argv[1], JSON.stringify(out), { mode: 0o600 });
            console.log("寫入的 secrets：" + (Object.keys(out).join("、") || "（沒有）"));
          ' "$secrets_file"
          npx wrangler deploy --secrets-file "$secrets_file" | tee "$RUNNER_TEMP/deploy.log"
          url="$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' "$RUNNER_TEMP/deploy.log" | head -1)"
          echo "WORKER_URL=$url" >> "$GITHUB_ENV"

      - name: 部署後檢查
        if: steps.check.outputs.ready == 'true'
        run: |
          if [ -z "$WORKER_URL" ]; then
            echo "::error::找不到 workers.dev 網址；請確認 Cloudflare 帳號已設定 workers.dev 子網域（見 main/worker/README.md）"
            exit 1
          fi
          for i in 1 2 3 4 5; do
            code="$(curl -s -o "$RUNNER_TEMP/healthz.json" -w '%{http_code}' "$WORKER_URL/healthz")" && [ "$code" = "200" ] && break
            sleep 5
          done
          echo "healthz：HTTP $code $(cat "$RUNNER_TEMP/healthz.json")"
          {
            echo "## Worker 已部署"
            echo ""
            echo "- 網址：$WORKER_URL"
            echo "- 前端用的 API 網址（切換時設定 VITE_API_URL）：\`$WORKER_URL/api/bookings/\`"
            echo "- 管理後台：$WORKER_URL/admin"
            echo "- LINE webhook（切換時才設定）：\`$WORKER_URL/line/webhook\`"
            echo "- 健康檢查：HTTP $code"
          } >> "$GITHUB_STEP_SUMMARY"
          cat "$GITHUB_STEP_SUMMARY"
          [ "$code" = "200" ]

      # ===== Cloudflare Pages 入口（*.pages.dev）=====
      # API token 需要 Account → Cloudflare Pages → Edit 權限
      - name: 建立 Pages 專案（已存在就略過）
        if: steps.check.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if out="$(npx wrangler pages project create meetbook --production-branch main 2>&1)"; then
            echo "$out"
          elif echo "$out" | grep -qi "already exists"; then
            echo "Pages 專案 meetbook 已存在"
          else
            echo "$out"
            echo "::error::無法建立 Pages 專案。若訊息是權限不足（Authentication error），請到 Cloudflare 編輯 API token，加上 Account → Cloudflare Pages → Edit 後重新執行"
            exit 1
          fi

      - name: 部署 Pages 入口
        if: steps.check.outputs.ready == 'true'
        working-directory: main/pages-entry
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          ../worker/node_modules/.bin/wrangler pages deploy --project-name meetbook --branch main --commit-dirty=true \
            | tee "$RUNNER_TEMP/pages.log"
          # 部署網址為 https://<代碼>.<專案子網域>.pages.dev；去掉第一段就是正式網址
          deployment="$(grep -oE 'https://[a-z0-9-]+\.[a-z0-9-]+\.pages\.dev' "$RUNNER_TEMP/pages.log" | tail -1)"
          if [ -z "$deployment" ]; then
            echo "::error::找不到 pages.dev 網址"
            exit 1
          fi
          echo "PAGES_URL=https://${deployment#https://*.}" >> "$GITHUB_ENV"

      - name: Pages 入口檢查
        if: steps.check.outputs.ready == 'true'
        run: |
          # 第一次建立專案時，網址可能要幾分鐘才生效
          code=000
          for i in $(seq 1 30); do
            code="$(curl -s -o "$RUNNER_TEMP/pages-healthz.json" -w '%{http_code}' --max-time 10 "$PAGES_URL/healthz")" || code=000
            [ "$code" = "200" ] && break
            sleep 10
          done
          notices="$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "$PAGES_URL/api/notices")" || notices=000
          {
            echo "## Pages 入口已部署"
            echo ""
            echo "- 網址：$PAGES_URL（公司網路可以連線）"
            echo "- 前端用的 API 網址：\`$PAGES_URL/api/bookings/\`"
            echo "- 管理後台：$PAGES_URL/admin"
            echo "- 健康檢查：HTTP $code；公告 API：HTTP $notices"
          } >> "$GITHUB_STEP_SUMMARY"
          cat "$GITHUB_STEP_SUMMARY"
          if [ "$code" = "000" ]; then
            echo "::warning::$PAGES_URL 還連不上；第一次建立時可能要再等幾分鐘，稍後開啟 $PAGES_URL/healthz 確認"
          elif [ "$code" != "200" ] || [ "$notices" != "200" ]; then
            echo "::error::Pages 入口回應不正確（healthz HTTP $code、notices HTTP $notices）"
            exit 1
          fi
