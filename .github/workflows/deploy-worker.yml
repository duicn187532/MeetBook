# 部署 Cloudflare Worker（後端）：main 上的 Worker 相關檔案有變動時自動部署，也可以手動執行
# 另外部署 Cloudflare Pages 入口，把請求轉給同一個 Worker（公司網路擋 workers.dev，但可以連 pages.dev），見 main/pages-entry
# repo 為公開：Worker／Pages 名稱、對外網址、萬用密碼都放在 GitHub Secrets（log 中會自動以 *** 遮蔽），
# 程式與 log 都不出現實際網址（見 main/worker/README.md 的「部署設定」）
name: 部署 Worker

on:
  push:
    branches: [main]
    paths:
      - "main/worker/**"
      - "main/project/admin/index.html"
      - "main/pages-entry/**"
      - ".github/workflows/deploy-worker.yml"
  workflow_dispatch:

permissions:
  contents: read

# 同時只跑一個部署，新的會排在舊的後面
concurrency:
  group: deploy-worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      WRANGLER_SEND_METRICS: "false"
    defaults:
      run:
        working-directory: main/worker
    steps:
      - name: 檢查設定
        id: check
        working-directory: .
        env:
          HAS_CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
          HAS_CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
        run: |
          if [ "$HAS_CF_TOKEN" = "true" ] && [ "$HAS_CF_ACCOUNT" = "true" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::尚未設定 CLOUDFLARE_API_TOKEN／CLOUDFLARE_ACCOUNT_ID，略過部署"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 檢查部署設定（GitHub Secrets）
        if: steps.check.outputs.ready == 'true'
        working-directory: .
        env:
          CF_WORKER_NAME: ${{ secrets.CF_WORKER_NAME }}
          CF_PAGES_PROJECT: ${{ secrets.CF_PAGES_PROJECT }}
          PUBLIC_BASE_URL: ${{ secrets.PUBLIC_BASE_URL }}
        run: |
          missing=""
          for k in CF_WORKER_NAME CF_PAGES_PROJECT PUBLIC_BASE_URL; do
            [ -n "${!k}" ] || missing="$missing $k"
          done
          if [ -n "$missing" ]; then
            echo "::error::缺少 GitHub Secrets：$missing（Settings → Secrets and variables → Actions，見 main/worker/README.md 的「部署設定」）"
            exit 1
          fi

      - uses: actions/checkout@v4
        if: steps.check.outputs.ready == 'true'

      - uses: actions/setup-node@v4
        if: steps.check.outputs.ready == 'true'
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: main/worker/package-lock.json

      - name: 安裝與型別檢查
        if: steps.check.outputs.ready == 'true'
        run: |
          npm ci
          npm run typecheck

      - name: 準備 D1（不存在就建立）並套用 migrations
        if: steps.check.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node atlas-import/d1_setup.ts
          npx wrangler d1 migrations apply meetbook --remote

      - name: 部署 Worker（同時寫入 Worker secrets）
        if: steps.check.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          LINE_CHANNEL_SECRET: ${{ secrets.LINE_CHANNEL_SECRET }}
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          MASTER_PASSWORD: ${{ secrets.MASTER_PASSWORD }}
          CF_WORKER_NAME: ${{ secrets.CF_WORKER_NAME }}
          PUBLIC_BASE_URL: ${{ secrets.PUBLIC_BASE_URL }}
        run: |
          # 預約網站（GitHub Pages）的網址由 repo 名稱推算，不寫在檔案中
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          website="https://${owner}.github.io/${GITHUB_REPOSITORY#*/}/"
          # 只寫入有設定的 secrets（沒設定的保留 Worker 上原本的值）；檔案只存在這次執行的暫存資料夾，用完即刪
          secrets_file="$RUNNER_TEMP/worker-secrets.json"
          trap 'rm -f "$secrets_file"' EXIT
          node -e '
            const out = {};
            for (const k of ["ADMIN_PASSWORD", "LINE_CHANNEL_SECRET", "LINE_CHANNEL_ACCESS_TOKEN", "MASTER_PASSWORD"]) if (process.env[k]) out[k] = process.env[k];
            require("fs").writeFileSync(process.argv[1], JSON.stringify(out), { mode: 0o600 });
            console.log("寫入的 secrets：" + (Object.keys(out).join("、") || "（沒有）"));
          ' "$secrets_file"
          # log 中的 *.workers.dev 網址一律遮蔽（Worker 名稱本身是 secret，會自動顯示為 ***）
          npx wrangler deploy --name "$CF_WORKER_NAME" --secrets-file "$secrets_file" \
            --var "WEBSITE_URL:$website" --var "FRONTEND_ORIGIN:https://${owner}.github.io" --var "PUBLIC_BASE_URL:$PUBLIC_BASE_URL" 2>&1 \
            | tee "$RUNNER_TEMP/deploy.log" | sed -E 's#https://[A-Za-z0-9.-]+\.workers\.dev#https://<已隱藏>.workers.dev#g'
          url="$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' "$RUNNER_TEMP/deploy.log" | head -1)"
          rm -f "$RUNNER_TEMP/deploy.log"
          if [ -z "$url" ]; then
            echo "::error::找不到 workers.dev 網址；請確認 Cloudflare 帳號已設定 workers.dev 子網域（見 main/worker/README.md）"
            exit 1
          fi
          echo "::add-mask::$url"
          echo "WORKER_URL=$url" >> "$GITHUB_ENV"

      - name: Worker 部署後檢查
        if: steps.check.outputs.ready == 'true'
        run: |
          for i in 1 2 3 4 5; do
            code="$(curl -s -o "$RUNNER_TEMP/healthz.json" -w '%{http_code}' "$WORKER_URL/healthz")" && [ "$code" = "200" ] && break
            sleep 5
          done
          echo "healthz：HTTP $code $(cat "$RUNNER_TEMP/healthz.json")"
          {
            echo "## Worker 已部署"
            echo ""
            echo "- 健康檢查：HTTP $code"
            echo "- 網址不顯示在這裡（repo 為公開）；LINE webhook 使用 Worker 的網址，可在 Cloudflare 控制台查看"
          } >> "$GITHUB_STEP_SUMMARY"
          [ "$code" = "200" ]

      # ===== Cloudflare Pages 入口 =====
      # API token 需要 Account → Cloudflare Pages → Edit 權限
      - name: 建立 Pages 專案（已存在就略過）
        if: steps.check.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_PAGES_PROJECT: ${{ secrets.CF_PAGES_PROJECT }}
        run: |
          if out="$(npx wrangler pages project create "$CF_PAGES_PROJECT" --production-branch main 2>&1)"; then
            echo "Pages 專案已建立"
          elif echo "$out" | grep -qi "already exists"; then
            echo "Pages 專案已存在"
          else
            echo "$out" | sed -E 's#https://[A-Za-z0-9.-]+\.pages\.dev#https://<已隱藏>.pages.dev#g'
            echo "::error::無法建立 Pages 專案。若訊息是權限不足（Authentication error），請到 Cloudflare 編輯 API token，加上 Account → Cloudflare Pages → Edit 後重新執行"
            exit 1
          fi

      - name: 部署 Pages 入口
        if: steps.check.outputs.ready == 'true'
        working-directory: main/pages-entry
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_PAGES_PROJECT: ${{ secrets.CF_PAGES_PROJECT }}
          CF_WORKER_NAME: ${{ secrets.CF_WORKER_NAME }}
        run: |
          # 設定檔中的專案名稱與 Worker 名稱是佔位字，只在這次執行的工作目錄中填入
          sed -i "s/__PAGES_PROJECT__/$CF_PAGES_PROJECT/; s/__WORKER_NAME__/$CF_WORKER_NAME/" wrangler.jsonc
          ../worker/node_modules/.bin/wrangler pages deploy --project-name "$CF_PAGES_PROJECT" --branch main --commit-dirty=true 2>&1 \
            | sed -E 's#https://[A-Za-z0-9.-]+\.pages\.dev#https://<已隱藏>.pages.dev#g'

      - name: Pages 入口檢查
        if: steps.check.outputs.ready == 'true'
        env:
          PUBLIC_BASE_URL: ${{ secrets.PUBLIC_BASE_URL }}
        run: |
          # 第一次建立專案時，網址可能要幾分鐘才生效
          code=000
          for i in $(seq 1 30); do
            code="$(curl -s -o "$RUNNER_TEMP/pages-healthz.json" -w '%{http_code}' --max-time 10 "$PUBLIC_BASE_URL/healthz")" || code=000
            [ "$code" = "200" ] && break
            sleep 10
          done
          notices="$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "$PUBLIC_BASE_URL/api/notices")" || notices=000
          {
            echo "## Pages 入口已部署"
            echo ""
            echo "- 健康檢查：HTTP $code；公告 API：HTTP $notices"
          } >> "$GITHUB_STEP_SUMMARY"
          cat "$GITHUB_STEP_SUMMARY"
          if [ "$code" = "000" ]; then
            echo "::warning::Pages 入口還連不上；第一次建立時可能要再等幾分鐘，稍後再確認 /healthz"
          elif [ "$code" != "200" ] || [ "$notices" != "200" ]; then
            echo "::error::Pages 入口回應不正確（healthz HTTP $code、notices HTTP $notices）"
            exit 1
          fi
