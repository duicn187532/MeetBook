# 前端自動部署：main 上的前端有變動時，自動建置並發布到 GitHub Pages（gh-pages 分支）
# 也可以在 GitHub 網頁或 App 的 Actions 頁面手動執行「Deploy frontend」
name: Deploy frontend

on:
  push:
    branches: [main]
    paths:
      - "main/meetingbooking/**"
      - ".github/workflows/deploy-frontend.yml"
  workflow_dispatch:

permissions:
  contents: write

# 同時只跑一個部署，新的會排在舊的後面，不會互相覆蓋
concurrency:
  group: deploy-frontend
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: main/meetingbooking
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: main/meetingbooking/package-lock.json
      - run: npm ci
      - name: 檢查設定
        env:
          PUBLIC_BASE_URL: ${{ secrets.PUBLIC_BASE_URL }}
          VITE_API_URL_OVERRIDE: ${{ vars.VITE_API_URL }}
        run: |
          if [ -z "$PUBLIC_BASE_URL" ] && [ -z "$VITE_API_URL_OVERRIDE" ]; then
            echo "::error::缺少 GitHub Secret PUBLIC_BASE_URL（見 main/worker/README.md 的「部署設定」）"
            exit 1
          fi
      - run: npm run build
        env:
          # 後端網址與聯絡窗口放在 GitHub Secrets（repo 為公開，不寫在檔案中）；建置後會編進前端程式
          # 要暫時換後端時，到 Settings → Variables 設定 VITE_API_URL 後手動執行這個 workflow
          VITE_API_URL: ${{ vars.VITE_API_URL || format('{0}/api/bookings/', secrets.PUBLIC_BASE_URL) }}
          VITE_CONTACT: ${{ secrets.CONTACT_LABEL }}
          # 中繼網址（舊 Deno 網址，轉給同一個 Worker）：公司網路連不上上面的網址時，網站自動改用這個網址
          # 未設定 BRIDGE_BASE_URL 時不啟用（見 main/project/bridge.ts、main/meetingbooking/src/api/backend.ts）
          VITE_API_URL_BRIDGE: ${{ secrets.BRIDGE_BASE_URL && format('{0}/api/bookings/', secrets.BRIDGE_BASE_URL) || '' }}
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: main/meetingbooking/dist
          # 保留舊檔案：還開著舊頁面的同事不會因為檔案被刪掉而出錯
          keep_files: true
          commit_message: "Deploy frontend from ${{ github.sha }}"
