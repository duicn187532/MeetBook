<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>MeetBook 後端速度測試</title>
<!--
  遷移到 Cloudflare 後，比較新舊後端從使用者所在位置（台灣）回應「查詢預約」的速度。
  只送出查詢（GET），不會改變任何資料。網站上沒有連結到這一頁；遷移收尾時會移除。
-->
<style>
  :root {
    --bg: #f5f6f4; --surface: #ffffff; --line: #dfe2dc; --text: #16181a; --muted: #5d6266;
    --old: #8a6d3b; --new: #1f6feb; --good: #18794e; --warn: #a15c00;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Noto Sans TC", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #111315; --surface: #1b1e21; --line: #2d3236; --text: #e9ecee; --muted: #a2a9ae;
      --old: #d4a45c; --new: #6ea8ff; --good: #4cc38a; --warn: #f0a44b; color-scheme: dark; }
  }
  body { margin: 0; background: var(--bg); color: var(--text); line-height: 1.6;
    padding: 24px max(16px, env(safe-area-inset-right)) 32px max(16px, env(safe-area-inset-left)); }
  main { max-width: 560px; margin: 0 auto; display: grid; gap: 16px; }
  h1 { font-size: 1.35rem; margin: 0; text-wrap: balance; }
  p { margin: 0; color: var(--muted); }
  button { font: inherit; font-weight: 600; border: 0; border-radius: 10px; padding: 14px 18px; cursor: pointer;
    background: var(--new); color: #fff; }
  button:disabled { opacity: .5; cursor: default; }
  button.secondary { background: var(--surface); color: var(--text); border: 1px solid var(--line); }
  button:focus-visible { outline: 3px solid var(--warn); outline-offset: 2px; }
  .panel { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px; display: grid; gap: 12px; }
  table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  th, td { text-align: right; padding: 8px 4px; border-bottom: 1px solid var(--line); }
  th:first-child, td:first-child { text-align: left; }
  .old { color: var(--old); } .new { color: var(--new); }
  .verdict { font-size: 1.15rem; font-weight: 700; }
  .verdict.good { color: var(--good); } .verdict.warn { color: var(--warn); }
  progress { width: 100%; }
  pre { margin: 0; white-space: pre-wrap; word-break: break-all; font-size: .85rem; color: var(--muted); }
</style>
</head>
<body>
<main>
  <h1>MeetBook 後端速度測試</h1>
  <p>比較舊系統（Deno Deploy）與新系統（Cloudflare）回應「查詢預約」的速度。會輪流各送出 21 次查詢，約 30 秒，不會改變任何資料。請在平常使用網站的地方、用平常的網路執行。</p>
  <button id="start" type="button">開始測試</button>
  <div class="panel" id="result" hidden>
    <progress id="progress" max="42" value="0"></progress>
    <div class="verdict" id="verdict"></div>
    <table>
      <thead><tr><th></th><th class="old">舊系統</th><th class="new">新系統</th></tr></thead>
      <tbody>
        <tr><td>第一次（含建立連線）</td><td id="old-first">-</td><td id="new-first">-</td></tr>
        <tr><td>之後 20 次的中位數</td><td id="old-median">-</td><td id="new-median">-</td></tr>
        <tr><td>之後 20 次最快</td><td id="old-min">-</td><td id="new-min">-</td></tr>
        <tr><td>之後 20 次最慢</td><td id="old-max">-</td><td id="new-max">-</td></tr>
      </tbody>
    </table>
    <pre id="summary"></pre>
    <button id="copy" class="secondary" type="button" hidden>複製結果</button>
  </div>
</main>
<script>
  const BACKENDS = {
    old: "https://meetingbooking.duicn187532.deno.net/api/bookings/",
    // 網站使用的 Cloudflare Pages 入口（轉給 Worker；公司網路也連得到）
    new: "https://meetbook.pages.dev/api/bookings/",
  };
  const ROUNDS = 21;
  const $ = (id) => document.getElementById(id);

  // 與網站相同的查詢範圍：上個月 1 日到 3 個月後的月底（台北時間）
  function frontendRange() {
    const t = new Date(Date.now() + 8 * 3600e3);
    const start = (offset) => new Date(Date.UTC(t.getUTCFullYear(), t.getUTCMonth() + offset, 1) - 8 * 3600e3);
    return { from: start(-1).toISOString(), to: new Date(start(4).getTime() - 1).toISOString() };
  }

  async function timeOnce(url) {
    const t0 = performance.now();
    const res = await fetch(url, { cache: "no-store" });
    await res.text();
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    return performance.now() - t0;
  }

  const ms = (v) => `${Math.round(v)} ms`;
  const median = (a) => { const s = [...a].sort((x, y) => x - y); return s[Math.floor(s.length / 2)]; };

  $("start").addEventListener("click", async () => {
    $("start").disabled = true;
    $("result").hidden = false;
    $("copy").hidden = true;
    $("verdict").textContent = "測試中…";
    $("verdict").className = "verdict";
    const q = `?${new URLSearchParams(frontendRange())}`;
    const times = { old: [], new: [] };
    let done = 0;
    try {
      for (let i = 0; i < ROUNDS; i++) {
        // 每一輪交換順序，避免某一邊總是先跑
        const order = i % 2 === 0 ? ["old", "new"] : ["new", "old"];
        for (const k of order) {
          times[k].push(await timeOnce(BACKENDS[k] + q));
          $("progress").value = ++done;
        }
      }
    } catch (error) {
      $("verdict").textContent = `測試失敗：${error.message}，請稍後再試`;
      $("verdict").className = "verdict warn";
      $("start").disabled = false;
      return;
    }
    const stat = {};
    for (const k of ["old", "new"]) {
      const rest = times[k].slice(1);
      stat[k] = { first: times[k][0], median: median(rest), min: Math.min(...rest), max: Math.max(...rest) };
      for (const f of ["first", "median", "min", "max"]) $(`${k}-${f}`).textContent = ms(stat[k][f]);
    }
    const ratio = stat.old.median / stat.new.median;
    $("verdict").textContent = ratio >= 1
      ? `新系統快 ${ratio.toFixed(1)} 倍（中位數）`
      : `新系統慢 ${(1 / ratio).toFixed(1)} 倍（中位數）`;
    $("verdict").className = `verdict ${ratio >= 1 ? "good" : "warn"}`;
    $("summary").textContent = [
      `時間：${new Date().toLocaleString("zh-TW", { timeZone: "Asia/Taipei" })}`,
      `舊 第一次 ${ms(stat.old.first)}，中位數 ${ms(stat.old.median)}（${ms(stat.old.min)}–${ms(stat.old.max)}）`,
      `新 第一次 ${ms(stat.new.first)}，中位數 ${ms(stat.new.median)}（${ms(stat.new.min)}–${ms(stat.new.max)}）`,
      `網路：${navigator.connection?.effectiveType ?? "未知"}`,
    ].join("\n");
    $("copy").hidden = false;
    $("start").disabled = false;
    $("start").textContent = "再測一次";
  });

  $("copy").addEventListener("click", async () => {
    try {
      await navigator.clipboard.writeText($("summary").textContent);
      $("copy").textContent = "已複製";
    } catch {
      const r = document.createRange();
      r.selectNodeContents($("summary"));
      getSelection().removeAllRanges();
      getSelection().addRange(r);
      $("copy").textContent = "請長按選取的文字複製";
    }
  });
</script>
</body>
</html>
